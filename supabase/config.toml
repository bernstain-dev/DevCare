project_id = "devcare"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/accept-invitation", "http://localhost:5173/reset-password", "http://127.0.0.1:5173/accept-invitation", "http://127.0.0.1:5173/reset-password"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
# Enable email login/invitations; the global auth flag above blocks registration.
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[auth.email.template.invite]
subject = "You’re invited to DevCare"
content_path = "./supabase/templates/invitation.html"

[auth.email.template.recovery]
subject = "Reset your DevCare password"
content_path = "./supabase/templates/recovery.html"

[storage]
enabled = true
file_size_limit = "5MiB"

[functions.admin-users]
verify_jwt = false

[functions.files]
verify_jwt = false
